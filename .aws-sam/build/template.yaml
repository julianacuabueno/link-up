AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Small Express app deployed with AWS SAM (Lambda + HTTP API)
Parameters:
  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID
  GoogleClientSecret:
    Type: String
    Description: Google OAuth Client Secret
    NoEcho: true
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 20
    MemorySize: 512
    Architectures:
    - x86_64
Resources:
  ExpressHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        AllowHeaders:
        - '*'
  ExpressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ExpressFunction
      Handler: lambda.handler
      Description: Express app behind HTTP API
      Environment:
        Variables:
          USERS_TABLE:
            Ref: UsersTable
          EVENTS_TABLE:
            Ref: EventsTable
          AUTH_TOKENS_TABLE:
            Ref: AuthTokensTable
          GOOGLE_CLIENT_ID:
            Ref: GoogleClientId
          GOOGLE_CLIENT_SECRET:
            Ref: GoogleClientSecret
          GOOGLE_REDIRECT_URI: https://guno6rd8a7.execute-api.us-west-2.amazonaws.com/api/auth/google/callback
          FRONTEND_URL: http://localhost:5173
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UsersTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: EventsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AuthTokensTable
      - AWSSecretsManagerGetSecretValuePolicy:
          SecretArn:
            Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:GoogleAPI-*
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ExpressHttpApi
            Path: /
            Method: ANY
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ExpressHttpApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      SamResourceId: ExpressFunction
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: email
        AttributeType: S
      KeySchema:
      - AttributeName: email
        KeyType: HASH
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      - AttributeName: user_email
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: user_email-index
        KeySchema:
        - AttributeName: user_email
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  AuthTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-auth-tokens
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: email
        AttributeType: S
      KeySchema:
      - AttributeName: email
        KeyType: HASH
  StaticWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  StaticWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: StaticWebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowCloudFrontServicePrincipalGetObject
          Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Join:
            - ''
            - - Fn::GetAtt:
                - StaticWebsiteBucket
                - Arn
              - /*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-oac
        Description: Access control for S3 origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
        - Id: S3Origin
          DomainName:
            Fn::GetAtt:
            - StaticWebsiteBucket
            - RegionalDomainName
          S3OriginConfig: {}
          OriginAccessControlId:
            Ref: CloudFrontOAC
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
        CustomErrorResponses:
        - ErrorCode: 403
          ResponsePagePath: /index.html
          ResponseCode: 200
          ErrorCachingMinTTL: 0
        - ErrorCode: 404
          ResponsePagePath: /index.html
          ResponseCode: 200
          ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
Outputs:
  ApiBaseUrl:
    Description: Base URL for the Express HTTP API
    Value:
      Fn::Sub: https://${ExpressHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ExpressFunctionArn:
    Description: ARN of the Lambda function running Express
    Value:
      Fn::GetAtt:
      - ExpressFunction
      - Arn
  CloudFrontDomainName:
    Description: CloudFront distribution domain
    Value:
      Fn::GetAtt:
      - CloudFrontDistribution
      - DomainName
  StaticWebsiteBucketName:
    Description: Name of the S3 bucket hosting the static website
    Value:
      Ref: StaticWebsiteBucket
  UsersTableName:
    Description: Name of the DynamoDB Users table
    Value:
      Ref: UsersTable
  EventsTableName:
    Description: Name of the DynamoDB Events table
    Value:
      Ref: EventsTable
  AuthTokensTableName:
    Description: Name of the DynamoDB Auth Tokens table
    Value:
      Ref: AuthTokensTable
